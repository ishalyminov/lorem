# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx512m"

# Use Java 17 from Ubuntu's system JDK for Android SDK build tasks
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

# AndroidX properties
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Keystore configuration for release builds
storeFile=/home/ishalyminov/data/location_reminder/keystore/location_reminder_new.jks
storePassword=REDACTED
keyAlias=location_reminder
keyPassword=REDACTED
# Suppress compileSdk=35 warning
android.suppressUnsupportedCompileSdk=35
android.suppressUnsupportedCompileSdk=35,36
android.enableBuildCache=false
org.gradle.caching=false
